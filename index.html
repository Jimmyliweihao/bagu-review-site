<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Java 后端与 Agent 面试知识复习框架。" />
    <title>八股复习站</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%23ffffff'/%3E%3Cstop offset='.55' stop-color='%23f7f7f7'/%3E%3Cstop offset='1' stop-color='%23ededed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='18' fill='url(%23g)'/%3E%3Crect x='3' y='3' width='58' height='58' rx='17' fill='none' stroke='white' stroke-opacity='.75' stroke-width='2'/%3E%3Cpath d='M18 22h28M18 32h22M18 42h28' stroke='%23333336' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css?v=gentle-cinema-fade-36" />
    <script src="./app.js?v=gentle-cinema-fade-36" defer></script>
  </head>
  <body data-atmosphere="aurora">
    <div class="apple-spatial-backdrop" aria-hidden="true">
      <div class="backdrop-gradient backdrop-aurora"></div>
      <div class="backdrop-gradient backdrop-daylight"></div>
      <div class="backdrop-gradient backdrop-obsidian"></div>
      <div class="backdrop-mesh">
        <div class="spatial-orb orb-cyan"></div>
        <div class="spatial-orb orb-indigo"></div>
        <div class="spatial-orb orb-rose"></div>
        <div class="spatial-orb orb-amber"></div>
        <div class="spatial-orb orb-emerald"></div>
      </div>
      <div class="backdrop-noise"></div>
      <div class="backdrop-mist" id="backdrop-mist" aria-hidden="true"></div>
    </div>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-group">
          <button id="brand-toggle" class="brand-mark-btn" type="button" aria-expanded="true" aria-label="收起顶部导航" title="收起顶部导航 (沉浸模式)">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          </button>
          <span class="brand-name">八股复习站</span>
        </div>
        <nav class="track-switch" role="tablist" aria-label="复习方向" data-active="backend">
          <span class="track-lens" aria-hidden="true"></span>
          <button id="tab-backend" class="track-tab" type="button" role="tab" aria-controls="workspace" data-track="backend">后端八股</button>
          <button id="tab-agent" class="track-tab" type="button" role="tab" aria-controls="workspace" data-track="agent">Agent 八股</button>
        </nav>
        <div class="header-actions">
          <div class="atmosphere-switch" role="group" aria-label="玻璃氛围模式" data-active="aurora">
            <span class="atmo-lens" aria-hidden="true"></span>
            <button type="button" class="atmo-tab active" data-atmo="aurora" title="极光流体">
              <svg class="atmo-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
              <span>极光</span>
            </button>
            <button type="button" class="atmo-tab" data-atmo="daylight" title="晨曦天光">
              <svg class="atmo-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
              <span>晨曦</span>
            </button>
            <button type="button" class="atmo-tab" data-atmo="obsidian" title="暗夜琉璃">
              <svg class="atmo-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <span>暗夜</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace" role="tabpanel" aria-labelledby="tab-backend">
      <div class="workspace-grid">
        <aside class="module-sidebar" aria-label="知识模块">
          <nav id="module-nav" aria-label="知识模块"></nav>
        </aside>

        <section class="main-panel" aria-labelledby="module-title">
          <div class="breadcrumb"><span id="breadcrumb-track">后端八股</span><span class="breadcrumb-separator" aria-hidden="true">›</span><span id="breadcrumb-module"></span></div>
          <div class="module-heading"><h2 id="module-title"></h2><span id="module-topic-count" class="topic-count">3 个方向</span></div>
          <section class="topic-section" aria-labelledby="topic-section-title">
            <h3 id="topic-section-title">复习方向</h3>
            <div id="topic-grid" class="topic-grid" aria-label="细分方向"></div>
          </section>
          <section class="question-panel" aria-labelledby="question-heading">
            <div class="question-panel-head"><h3 id="question-heading">题目</h3><span class="question-count">0 道题</span></div>
            <div class="empty-state"><div class="empty-icon" aria-hidden="true"><span></span><span></span><span></span></div><strong id="empty-title">还没有题目</strong><p id="empty-description">选择一个复习方向，之后可在这里查看题目。</p></div>
          </section>
        </section>
      </div>
    </main>
  </body>
</html>
